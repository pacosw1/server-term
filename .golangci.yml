version: "2"
# Baseline from the CIP onboarding (task 2283): the code had 31 lint findings
# before the gate existed. They are excluded here so the gate stays green and
# still fails on anything new. Remove a rule when its code is cleaned up.
linters:
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1012
  exclusions:
    rules:
      - linters:
          - errcheck
        text: 'Error return value of `(\w+\.)*(Close|CloseNow|Remove|Fprintf|Setenv)` is not checked'
      - linters:
          - unused
        text: '(openSSH|cipRunIDAtRow|cipActionTimeout)'
