name: ServtermMobile
options:
  bundleIdPrefix: com.servterm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ServtermKit:
    path: ServtermKit
targets:
  ServtermMobile:
    type: application
    platform: iOS
    sources:
      - path: ServtermMobile
    dependencies:
      - package: ServtermKit
        product: ServtermKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servterm.mobile
        PRODUCT_NAME: ServtermMobile
        INFOPLIST_FILE: ServtermMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
  ServtermMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServtermMobileTests
    dependencies:
      - target: ServtermMobile
      - package: ServtermKit
        product: ServtermKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servterm.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ServtermMobileTests/Info.plist
schemes:
  ServtermMobile:
    build:
      targets:
        ServtermMobile: all
        ServtermMobileTests: [test]
    test:
      targets:
        - ServtermMobileTests
    run:
      config: Debug
