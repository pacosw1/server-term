# SwiftTerm ships a build tool plug-in. A command line build fails on
# "Validate plug-in" until it is trusted, so every xcodebuild command for
# this project needs:
#   -skipPackagePluginValidation -skipMacroValidation
# In Xcode.app you approve the plug-in once in a dialog instead.
name: ServtermMobile
options:
  bundleIdPrefix: com.servterm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ServtermKit:
    path: ServtermKit
  ServtermSSH:
    path: ServtermSSH
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.20.0
targets:
  ServtermMobile:
    type: application
    platform: iOS
    sources:
      - path: ServtermMobile
    dependencies:
      - package: ServtermKit
        product: ServtermKit
      - package: ServtermSSH
        product: ServtermSSH
      - package: SwiftTerm
        product: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servterm.mobile
        PRODUCT_NAME: ServtermMobile
        INFOPLIST_FILE: ServtermMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
  ServtermMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ServtermMobileTests
    dependencies:
      - target: ServtermMobile
      - package: ServtermKit
        product: ServtermKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servterm.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: ServtermMobileTests/Info.plist
  ServtermMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ServtermMobileUITests
    dependencies:
      - target: ServtermMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servterm.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ServtermMobile
schemes:
  ServtermMobile:
    build:
      targets:
        ServtermMobile: all
        ServtermMobileTests: [test]
        ServtermMobileUITests: [test]
    test:
      targets:
        - ServtermMobileTests
    run:
      config: Debug
  ShellInput:
    build:
      targets:
        ServtermMobile: all
        ServtermMobileUITests: [test]
    test:
      targets:
        - name: ServtermMobileUITests
          skippedTests:
            - ScreenshotTests
            - ShellVerificationTests

  ShellVerification:
    build:
      targets:
        ServtermMobile: all
        ServtermMobileUITests: [test]
    test:
      targets:
        - name: ServtermMobileUITests
          skippedTests:
            - ScreenshotTests
            - ShellInputTests

  Screenshots:
    build:
      targets:
        ServtermMobile: all
        ServtermMobileUITests: [test]
    test:
      targets:
        - name: ServtermMobileUITests
          skippedTests:
            - ShellVerificationTests
            - ShellInputTests
